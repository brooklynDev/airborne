on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        rack:
          - version: '~> 2.2'
            sinatra: '~> 2.2'
          - version: '~> 3.0'
            sinatra: '~> 4.0'

    env:
      RACK_VERSION: ${{ matrix.rack.version }}
      SINATRA_VERSION: ${{ matrix.rack.sinatra }}

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake

  rails:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        load_order: [before, after]
        framework:
          - rails: '~> 7.1.0'
            rspec: '~> 6.1'
            rack: '~> 2.2'
            sinatra: '~> 2.2'
          - rails: '~> 7.2.0'
            rspec: '~> 7.1'
            rack: '~> 3.0'
            sinatra: '~> 4.0'
          - rails: '~> 8.1.0'
            rspec: '~> 8.0'
            rack: '~> 3.0'
            sinatra: '~> 4.0'
    env:
      RAILS_VERSION: ${{ matrix.framework.rails }}
      RSPEC_RAILS_VERSION: ${{ matrix.framework.rspec }}
      RACK_VERSION: ${{ matrix.framework.rack }}
      SINATRA_VERSION: ${{ matrix.framework.sinatra }}
      AIRBORNE_LOAD_ORDER: ${{ matrix.load_order }}
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - run: bundle exec rspec integration/rails --format progress
