on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        rack:
          - version: '~> 2.2'
            sinatra: '~> 2.2'
          - version: '~> 3.0'
            sinatra: '~> 4.0'

    env:
      RACK_VERSION: ${{ matrix.rack.version }}
      SINATRA_VERSION: ${{ matrix.rack.sinatra }}

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake
